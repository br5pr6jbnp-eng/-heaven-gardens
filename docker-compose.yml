services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SITE_URL: https://your-domain.com      # used for canonical links + sitemap
      ADMIN_TOKEN: change-me-to-a-long-random-string
      TRUST_PROXY: "1"                        # we are behind nginx
    volumes: [ "orders-data:/data" ]
    read_only: true
    tmpfs: [ /tmp ]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: [ "80:80" ]                        # add 443 + certificates (e.g. Caddy / certbot) for HTTPS
    volumes: [ "./nginx.conf:/etc/nginx/conf.d/default.conf:ro", "nginx-cache:/var/cache/nginx" ]
    depends_on: [ app ]
volumes: { orders-data: {}, nginx-cache: {} }
