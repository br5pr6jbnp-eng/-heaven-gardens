# Edge cache + connection buffering in front of the Node app: most traffic never reaches Node.
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=hg:20m max_size=500m inactive=7d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=orders:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=general:20m rate=30r/s;

upstream app { server app:3000; keepalive 64; }

server {
  listen 80;
  client_max_body_size 32k;
  gzip off;                                    # Node already serves pre-compressed brotli/gzip

  location = /api/orders {
    limit_req zone=orders burst=4 nodelay;
    proxy_pass http://app; proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host;
  }
  location /api/ {                             # dynamic: never cached, own throttling in the app
    proxy_pass http://app; proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host;
  }
  location /img/ {                             # product photos: cache hard
    proxy_cache hg; proxy_cache_valid 200 30d; proxy_cache_use_stale error timeout updating;
    proxy_pass http://app; proxy_http_version 1.1; proxy_set_header Connection "";
  }
  location / {
    limit_req zone=general burst=80 nodelay;
    proxy_cache hg; proxy_cache_valid 200 1m; proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;   # site stays up even if Node restarts
    proxy_no_cache $http_authorization; proxy_cache_bypass $http_authorization;
    proxy_pass http://app; proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host;
  }
}
